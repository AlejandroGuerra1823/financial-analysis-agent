[project]
name = "finance-agent"
version = "0.1.0"
description = "Multi-step LangGraph agent: categorizes bank transactions (COP), detects anomalies with hybrid rules + LLM review, and writes an eval-scored financial report."
readme = "README.md"
authors = [
    { name = "Alejandro Guerra", email = "guerramanuel299@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.7.4",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
]

[project.scripts]
finance-agent = "finance_agent:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
